<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>William's Garage — Cars</title><style>body{font-family:system-ui;background:#05070d;color:#fff;margin:0}.wrap{max-width:1200px;margin:auto;padding:30px}.car{border:1px solid #263247;border-radius:20px;padding:20px;background:#09111c}.cars{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.car img{width:100%;height:220px;object-fit:contain;background:#070b12;border-radius:14px}.car h2{margin-bottom:4px}.tag{color:#22d3ee;font:700 12px monospace}.sparkle{padding:12px 18px;border:0;border-radius:12px;background:linear-gradient(100deg,#06b6d4,#8b5cf6,#ec4899);color:white;font-weight:800;cursor:pointer}.spark{position:fixed;top:-20px;width:7px;height:12px;animation:fall 1.6s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:0}}</style></head><body><main class="wrap"><p class="tag">WILLIAM'S AUTOMOTIVE ARCHIVE</p><h1>CARS.</h1><p>Actual cars. Actual images. No emoji substitutes.</p><button class="sparkle" id="sparkle">✨ MAKE IT SPARKLE</button><section class="cars"><article class="car"><img src="mclaren.png" alt="McLaren F1"><h2>McLaren F1</h2></article><article class="car"><img src="delta.png" alt="Lancia Delta Integrale"><h2>Lancia Delta Integrale</h2></article><article class="car"><img src="subaru.png" alt="1999 Subaru Impreza WRX STI"><h2>1999 Subaru Impreza WRX STI</h2></article><article class="car"><img src="954.png" alt="Porsche 964"><h2>Porsche 964</h2></article><article class="car"><img src="ferrari.png" alt="Ferrari Testarossa"><h2>Ferrari Testarossa</h2></article></section></main><script>function spark(){for(let i=0;i<70;i++){const s=document.createElement('i');s.className='spark';s.style.left=Math.random()*100+'vw';s.style.background=`hsl(${Math.random()*360} 95% 70%)`;s.style.animationDelay=Math.random()*.5+'s';document.body.appendChild(s);setTimeout(()=>s.remove(),2200)}}document.getElementById('sparkle').onclick=spark;</script></body></html>
